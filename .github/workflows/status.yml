name: status

# Renders src/status-{dark,light}.svg and force-pushes them to the `output`
# branch, which the README loads. Keeps the daily refresh out of main's history.
#
# Optional: add a STATS_TOKEN secret (fine-grained PAT, read-only "Metadata" on
# all repos) and a repository variable STATS_PRIVATE=1 to count private repos.

on:
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/status.yml"]

permissions:
  contents: write

concurrency:
  group: status
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Render
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
          STATS_PRIVATE: ${{ vars.STATS_PRIVATE }}
        run: python3 scripts/status.py

      - name: Push to output branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir out && cp src/status-*.svg out/ && cd out
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "status: $(date -u +%F)"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
